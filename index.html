<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Nostr Web Chat (NIP-59 v2 + IndexedDB)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f0f2f5; }
    #chatWindow { height: 45vh; overflow-y: auto; background-color: #efeae2; display: flex; flex-direction: column; }
    .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; word-wrap: break-word; }
    .msg-in { background-color: #ffffff; align-self: flex-start; border-bottom-left-radius: 0; }
    .msg-out { background-color: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
    .time-stamp { font-size: 0.7em; color: #667781; display: block; text-align: right; margin-top: 4px; }
    #debugLog { height: 30vh; overflow-y: auto; background-color: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 0.85rem; padding: 10px; white-space: pre-wrap; }
    .debug-error { color: #ff5555; }
    .debug-info { color: #55ffff; }
    .debug-success { color: #55ff55; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container py-3" style="max-width: 900px;">
    
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h4 class="mb-0">Nostr Chat (NIP-04 + NIP-59)</h4>
      <div>
        <button id="clearDbBtn" class="btn btn-outline-danger btn-sm me-2">🗑️ Vymazat DB</button>
        <button id="publishRelaysBtn" class="btn btn-warning btn-sm">📡 Oznámit relaye pro Amethyst</button>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div id="chatWindow" class="card-body p-3">
        <div class="text-center text-muted small mt-2" id="chatStatus">Připojuji se...</div>
      </div>
      <div class="card-footer bg-white d-flex gap-2 p-2">
        <input type="text" id="messageInput" class="form-control" placeholder="Napiš zprávu..." disabled />
        <button id="sendBtn" class="btn btn-primary px-4" disabled>Odeslat NIP-59</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white py-1 small">🐞 Vývojářský Log (Nyní s lokálním ukládáním IndexedDB)</div>
      <div id="debugLog"></div>
    </div>

  </div>

  <script type="module">
    import { getPublicKey, finalizeEvent, generateSecretKey, getEventHash, nip04, nip44, nip19 } from 'https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/+esm';
    import { hexToBytes } from 'https://cdn.jsdelivr.net/npm/@noble/hashes@1.3.0/utils/+esm';

    const PRIVATE_KEY_HEX = "e0b6b02c0d9d55286c9486a5f402f95661ab1c829eec032157a4d59e7e5eb3f7";
    const PRIVATE_KEY_BYTES = hexToBytes(PRIVATE_KEY_HEX);
    const PUBLIC_KEY_HEX = getPublicKey(PRIVATE_KEY_BYTES);
    
    const PARTNER_NPUB = "npub1jv32mgkzf8nq9h09m4jae8dkk3vxpzr0vn44p7tkztm837c8rf0s6a370t";
    const partnerHex = nip19.decode(PARTNER_NPUB).data;

    let messagesCache = []; 
    const seenEvents = new Set();
    const sockets = [];
    
    const relayURLs = [
      "wss://relay.damus.io", 
      "wss://nos.lol",
      "wss://relay.nostr.band",
      "wss://relay.primal.net"
    ];

    const chatWindow = document.getElementById("chatWindow");
    const debugLog = document.getElementById("debugLog");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    function logDebug(type, message, obj = null) {
      const time = new Date().toLocaleTimeString();
      let colorClass = type === 'ERROR' ? 'debug-error' : (type === 'SUCCESS' ? 'debug-success' : 'debug-info');
      let text = `<span class="${colorClass}">[${time}] ${type}: ${message}</span>\n`;
      if (obj) text += JSON.stringify(obj, null, 2) + "\n\n";
      else text += "\n";
      debugLog.innerHTML += text;
      debugLog.scrollTop = debugLog.scrollHeight;
    }

    // ==========================================
    // LOKÁLNÍ DATABÁZE (INDEXED DB)
    // ==========================================
    const DB_NAME = 'NostrChatDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'messages';

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = (e) => reject(e.target.error);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('timestamp', 'timestamp', { unique: false });
            store.createIndex('partnerPubkey', 'partnerPubkey', { unique: false });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
      });
    }

    async function saveMessage(msgObj) {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const request = store.put(msgObj);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      } catch (e) {
        logDebug("ERROR", "Nepodařilo se uložit zprávu do DB", e);
      }
    }

    async function getMessages(partnerPubkey) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const index = store.index('partnerPubkey');
        const request = index.getAll(IDBKeyRange.only(partnerPubkey));
        request.onsuccess = () => {
          resolve(request.result.sort((a, b) => a.timestamp - b.timestamp));
        };
        request.onerror = () => reject(request.error);
      });
    }

    // Tlačítko pro vymazání DB
    document.getElementById("clearDbBtn").addEventListener("click", () => {
      if (confirm("Opravdu vymazat celou historii chatu z paměti prohlížeče?")) {
        indexedDB.deleteDatabase(DB_NAME);
        location.reload();
      }
    });

    // ==========================================
    // PŘIPOJENÍ A STAHOVÁNÍ
    // ==========================================
    function connectRelays(lastTimestamp) {
      const filter1 = { kinds: [4, 1059], authors: [PUBLIC_KEY_HEX] };
      const filter2 = { kinds: [4, 1059], '#p': [PUBLIC_KEY_HEX] };

      // Ochrana před datovým spamem - pokud máme DB, stahujeme jen novinky!
      if (lastTimestamp) {
        filter1.since = lastTimestamp + 1;
        filter2.since = lastTimestamp + 1;
      } else {
        filter1.limit = 50;
        filter2.limit = 50;
      }

      const reqMsg = JSON.stringify(["REQ", "chat-sync", filter1, filter2]);

      relayURLs.forEach(url => {
        const ws = new WebSocket(url);
        sockets.push(ws);
        
        ws.onopen = () => {
          ws.send(reqMsg);
          messageInput.disabled = false;
          sendBtn.disabled = false;
        };
        
        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data[0] === "EVENT") handleIncomingEvent(data[2]);
          } catch (e) {}
        };
      });
    }

    async function handleIncomingEvent(ev) {
      if (seenEvents.has(ev.id)) return;
      seenEvents.add(ev.id);

      const statusEl = document.getElementById("chatStatus");
      if (statusEl) statusEl.style.display = "none";

      if (ev.kind === 4) {
        const isMe = ev.pubkey === PUBLIC_KEY_HEX;
        const pTag = ev.tags.find(t => t[0] === 'p');
        const otherPubKey = isMe ? (pTag ? pTag[1] : null) : ev.pubkey;

        if (otherPubKey === partnerHex) {
          try {
            const text = await nip04.decrypt(PRIVATE_KEY_BYTES, otherPubKey, ev.content);
            displayMessage(text, isMe, ev.created_at, ev.id);
            saveMessage({ id: ev.id, text, isMe, timestamp: ev.created_at, partnerPubkey: partnerHex });
          } catch (e) {}
        }
        return;
      }

      if (ev.kind === 1059) {
        try {
          const outerKey = nip44.getConversationKey(PRIVATE_KEY_BYTES, ev.pubkey);
          const sealJson = nip44.decrypt(ev.content, outerKey);
          const sealEvent = JSON.parse(sealJson);

          if (sealEvent.kind === 13) {
            const realSenderPubkey = sealEvent.pubkey; 
            
            const innerKey = nip44.getConversationKey(PRIVATE_KEY_BYTES, realSenderPubkey);
            const gossipJson = nip44.decrypt(sealEvent.content, innerKey);
            const gossipEvent = JSON.parse(gossipJson); 

            if (gossipEvent.kind === 14) {
              if (realSenderPubkey === partnerHex) {
                displayMessage(gossipEvent.content, false, gossipEvent.created_at, ev.id);
                saveMessage({ id: ev.id, text: gossipEvent.content, isMe: false, timestamp: gossipEvent.created_at, partnerPubkey: partnerHex });
              }
            }
          }
        } catch (e) {}
      }
    }

    function displayMessage(text, isMe, timestamp, id) {
      // Ochrana proti vykreslení duplikátu v cache
      if (messagesCache.some(m => m.id === id)) return;
      
      messagesCache.push({ id, text, isMe, timestamp });
      messagesCache.sort((a, b) => a.timestamp - b.timestamp);
      
      chatWindow.innerHTML = ''; 
      
      messagesCache.forEach(msg => {
        const timeStr = new Date(msg.timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const bubble = document.createElement("div");
        bubble.className = `msg-bubble shadow-sm ${msg.isMe ? 'msg-out' : 'msg-in'}`;
        bubble.innerHTML = `<div>${msg.text}</div><span class="time-stamp">${timeStr}</span>`;
        chatWindow.appendChild(bubble);
      });
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    sendBtn.addEventListener("click", async () => {
      const text = messageInput.value.trim();
      if (!text) return;

      try {
        const now = Math.floor(Date.now() / 1000);

        const gossipTemplate = {
          kind: 14,
          pubkey: PUBLIC_KEY_HEX,
          created_at: now,
          tags: [["p", partnerHex]],
          content: text
        };

        const gossipEvent = {
          ...gossipTemplate,
          id: getEventHash(gossipTemplate),
          sig: ""
        };

        const innerKey = nip44.getConversationKey(PRIVATE_KEY_BYTES, partnerHex);
        const sealContent = nip44.encrypt(JSON.stringify(gossipEvent), innerKey);
        
        const sealEvent = finalizeEvent({
          kind: 13,
          created_at: now - Math.floor(Math.random() * 3600), 
          tags: [],
          content: sealContent
        }, PRIVATE_KEY_BYTES);

        const ephemeralPriv = generateSecretKey(); 
        const ephemeralPub = getPublicKey(ephemeralPriv);
        
        const outerKey = nip44.getConversationKey(ephemeralPriv, partnerHex);
        const wrapContent = nip44.encrypt(JSON.stringify(sealEvent), outerKey);
        
        const wrapEvent = finalizeEvent({
          kind: 1059,
          created_at: now,
          tags: [["p", partnerHex]],
          content: wrapContent
        }, ephemeralPriv);

        sockets.forEach(ws => {
          if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(["EVENT", wrapEvent]));
        });

        displayMessage(text, true, now, wrapEvent.id);
        saveMessage({ id: wrapEvent.id, text, isMe: true, timestamp: now, partnerPubkey: partnerHex });
        messageInput.value = "";

      } catch (err) {
        logDebug("ERROR", "Chyba při odesílání", err.message || err);
      }
    });

    document.getElementById("publishRelaysBtn").addEventListener("click", () => {
      try {
        const now = Math.floor(Date.now() / 1000);

        const event10002 = finalizeEvent({
          kind: 10002, 
          created_at: now,
          tags: relayURLs.map(url => ["r", url]), 
          content: ""
        }, PRIVATE_KEY_BYTES);

        const event10050 = finalizeEvent({
          kind: 10050,
          created_at: now,
          tags: relayURLs.map(url => ["relay", url]),
          content: ""
        }, PRIVATE_KEY_BYTES);
        
        sockets.forEach(ws => { 
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(["EVENT", event10002])); 
            ws.send(JSON.stringify(["EVENT", event10050])); 
          }
        });
        
        logDebug("INFO", "✅ Odesláno nastavení relayů (NIP-65 i NIP-17)");
        alert("Nastavení odesláno! Nyní MUSÍŠ jít do Amethystu, otevřít profil tohoto testovacího účtu a 'potáhnout dolů' (obnovit profil).");
      } catch (err) {
        logDebug("ERROR", "Chyba oznámení relayů", err.message || err);
      }
    });

    messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendBtn.click(); });
    
    // ==========================================
    // INICIALIZACE PO STARTU STRÁNKY
    // ==========================================
    async function startChat() {
      try {
        // 1. Zkusíme načíst historii z prohlížeče
        const localHistory = await getMessages(partnerHex);
        let lastTimestamp = null;

        if (localHistory.length > 0) {
          logDebug("INFO", `Načteno ${localHistory.length} zpráv z lokální databáze.`);
          const statusEl = document.getElementById("chatStatus");
          if (statusEl) statusEl.style.display = "none";
          
          localHistory.forEach(msg => {
            seenEvents.add(msg.id);
            displayMessage(msg.text, msg.isMe, msg.timestamp, msg.id);
          });
          lastTimestamp = localHistory[localHistory.length - 1].timestamp;
        }

        // 2. Teprve nyní se připojíme k síti
        connectRelays(lastTimestamp);

      } catch (err) {
        logDebug("ERROR", "Chyba lokální databáze. Načítám vše z relayů.", err);
        connectRelays(null);
      }
    }

    // Spuštění
    startChat();
  </script>
</body>
</html>
